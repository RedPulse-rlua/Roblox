name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-android.yml']

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLIENT: clients/al-ex427__rbx2016
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ninja and SDK packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDKM" --install "platforms;android-28" "build-tools;34.0.0" > /dev/null

      - name: Place FMOD .so into fmod/Android tree
        run: |
          SRC="clients/al-ex427__rbx2016/Android/NativeShell/build/intermediates/merged_native_libs/standardRelease/mergeStandardReleaseNativeLibs/out/lib"
          for abi in armeabi-v7a x86; do
            mkdir -p "clients/al-ex427__rbx2016/fmod/Android/$abi"
            cp "$SRC/$abi/libfmod.so" "clients/al-ex427__rbx2016/fmod/Android/$abi/"
            ls -la "clients/al-ex427__rbx2016/fmod/Android/$abi/"
          done

      - name: Download Android NDK r17c (linux)
        run: |
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q ndk.zip -d ndk
          ls ndk

      - name: Fix case-sensitive includes
        run: |
          cd "clients/al-ex427__rbx2016"
          ROOTS=$(find . -maxdepth 4 -type d -name include 2>/dev/null)
          echo "include roots: $(echo $ROOTS)"
          grep -rhoE '#include "[^"]+"' --include='*.cpp' --include='*.h' --include='*.cc' --include='*.c' . 2>/dev/null \
            | sed -E 's/^#include "([^"]+)"$/\1/' | sort -u > /tmp/natinc.txt
          echo "total includes: $(wc -l < /tmp/natinc.txt)"
          LINKED=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            case "$rel" in /*|../*) continue;; esac
            d=$(dirname "$rel"); b=$(basename "$rel")
            for r in $ROOTS; do
              [ -e "$r/$rel" ] && continue
              found=$(find "$r/$d" -maxdepth 1 -iname "$b" 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                ln -sf "$PWD/$found" "$r/$rel"
                LINKED=$((LINKED+1))
                echo "LINKED $r/$rel -> $found"
              fi
            done
          done < /tmp/natinc.txt
          echo "case-fix done, linked=$LINKED"

      - name: Build libroblox.so (armeabi-v7a, x86)
        run: |
          SET="$(pwd)/clients/al-ex427__rbx2016"
          NDK="$(pwd)/ndk/android-ndk-r17c"
          STL="$NDK/sources/cxx-stl"
          echo "=== DIAG asm dir ==="
          ls -la "$SET/Contribs/android/asm/" || echo NO_ASM_DIR
          ls -la "$SET/Contribs/android/asm/page.h" 2>/dev/null || echo NO_PAGE_H
          for abi in armeabi-v7a x86; do
            rm -rf "$SET/Android/build/release/$abi"
            cmake -S "$SET" -B "$SET/Android/build/release/$abi" -G Ninja \
              -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_NDK="$NDK" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static \
              -DANDROID_ARM_NEON=OFF \
              -DRBX_STL_INCLUDE_DIRS="$STL/llvm-libc++/include;$STL/llvm-libc++abi/include;$STL/../../sources/android/support/include" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-isystem $SET/Contribs/android" \
              -DCMAKE_CXX_FLAGS="-isystem $SET/Contribs/android" \
              -DCONTRIB_PATH="$SET/Contribs"
            cmake --build "$SET/Android/build/release/$abi" -- -j$(nproc)
            ls -la "$SET/Android/build/release/$abi/libroblox.so"
          done

      - name: Assemble Release APK
        run: |
          ROOT="$(pwd)"
          cd clients/al-ex427__rbx2016/Android
          ./gradlew :NativeShell:assembleRelease \
            --project-prop android.useAndroidX=false \
            --project-prop android.enableJetifier=false \
            --gradle-user-home "$ROOT/.gradle-cache" \
            --console=plain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: roblox2016-android
          path: |
            clients/al-ex427__rbx2016/Android/NativeShell/build/outputs/apk/*/*.apk
            clients/al-ex427__rbx2016/Android/build/release/*/libroblox.so
          if-no-files-found: error