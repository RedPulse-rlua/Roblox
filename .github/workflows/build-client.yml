name: Build Roblox 2016 Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Configure git long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v140 toolset into VS2022
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.v140.x86.x64 --quiet --norestart
          $LASTEXITCODE

      - name: Try to fetch prebuilt Qt 4.8.5
        shell: powershell
        run: |
          try {
            $page = Invoke-RestMethod "https://api.gofile.io/getContent?contentId=Plze0w" -UseBasicParsing
            $link = $page.data.contents.Values | Select-Object -First 1 | ForEach-Object { $_.link }
            if ($link) {
              Invoke-WebRequest $link -OutFile "clients/al-ex427__rbx2016/Contribs/qt.7z" -UseBasicParsing
              echo "Qt downloaded: $($(Get-Item clients/al-ex427__rbx2016/Contribs/qt.7z).Length) bytes"
            } else { echo "qt.7z not found on gofile" }
          } catch { echo "Qt download failed: $_" }

      - name: Install 7zip
        shell: powershell
        run: choco install -y 7zip --no-progress

      - name: Extract Qt
        shell: powershell
        run: |
          $qt = "clients/al-ex427__rbx2016/Contribs/qt.7z"
          if (Test-Path $qt) {
            Push-Location "clients/al-ex427__rbx2016/Contribs"
            & "C:\Program Files\7-Zip\7z.exe" x qt.7z -y -o. | Out-String | Write-Host
            Pop-Location
          } else { echo "qt.7z missing, WindowsClient will fail" }

      - name: Build Boost (part of deps)
        shell: powershell
        working-directory: clients/al-ex427__rbx2016/Contribs/boost_1_56_0
        run: |
          cmd /c bootstrap.bat
          cmd /c "call \"C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat\" && b2.exe toolset=msvc-14.0 variant=release link=static runtime-link=static threading=multi address-model=32 --with-date_time --with-filesystem --with-regex --with-system --with-thread --with-chrono --with-random --with-signals --with-serialization --with-program_options --with-locale -j 2"

      - name: Build WindowsClient and RCCService
        shell: powershell
        continue-on-error: false
        run: |
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          $sln = "clients/al-ex427__rbx2016/Client_2016.sln"
          & $msbuild $sln /m:2 /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v140 /p:WindowsTargetPlatformVersion=10.0 /t:WindowsClient /v:minimal 2>&1 | Out-String
          & $msbuild $sln /m:2 /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v140 /p:WindowsTargetPlatformVersion=10.0 /t:RCCService /v:minimal 2>&1 | Out-String
          echo "BUILD_EXIT=$LASTEXITCODE" >> $env:GITHUB_ENV

      - name: Collect and upload artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Get-ChildItem -Recurse -Path "clients/al-ex427__rbx2016" -Include *.exe,*.dll,*.pdb -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\Release\\" } | Copy-Item -Destination artifacts -Force
          Get-ChildItem artifacts | Select-Object Name,Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7