name: Build Roblox 2016 Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Configure git long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install v140 toolset into VS2022
        shell: powershell
        run: |
          $args = @('modify','--installPath','C:\Program Files\Microsoft Visual Studio\2022\Enterprise','--add','Microsoft.VisualStudio.Component.VC.v140.x86.x64','--quiet','--norestart','--wait','--nocache')
          $p = Start-Process -FilePath "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList $args -Wait -PassThru -NoNewWindow
          Write-Host "setup.exe exit: $($p.ExitCode), v140 dir exists: $(Test-Path 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v140')"
          if (-not (Test-Path 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v140')) {
            Write-Host "Falling back to VS2019 BuildTools bootstrapper"
            Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vs_buildtools.exe" -OutFile "$env:TEMP\vs_buildtools.exe" -UseBasicParsing
            Start-Process "$env:TEMP\vs_buildtools.exe" -ArgumentList '--quiet','--wait','--norestart','--nocache','--add','Microsoft.VisualStudio.Workload.VCTools','--add','Microsoft.VisualStudio.Component.VC.v140.x86.x64','--includeRecommended' -Wait -PassThru -NoNewWindow
            Write-Host "BT v140 dir exists: $(Test-Path 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Microsoft\VC\v140')"
          }

      - name: Build RCCService (Release, Win32, v140)
        shell: powershell
        continue-on-error: true
        run: |
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v140')) {
            $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
          }
          Write-Host "Using MSBuild: $msbuild"
          $sln = "clients/al-ex427__rbx2016/Client_2016.sln"
          & $msbuild $sln /m:2 /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v140 /p:WindowsTargetPlatformVersion=10.0 /t:RCCService /v:minimal 2>&1 | Tee-Object -FilePath build_output.log
          Write-Host "RCCService build exit: $LASTEXITCODE"

      - name: Collect build output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Get-ChildItem -Recurse -Path "clients/al-ex427__rbx2016" -Include *.exe,*.dll,*.pdb -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\Release\\|\\Debug\\" } | ForEach-Object { Copy-Item -Destination artifacts -Force }
          Get-ChildItem artifacts -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7